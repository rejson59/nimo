<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="color-scheme" content="dark" />
  <title>nimo · symulator OLED 128×64</title>
  <meta name="description" content="Poligon firmware dla miniaturowego urządzenia nimo: ESP32 i ekran OLED 0.96 cala, 128×64." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a16'/%3E%3Crect x='4' y='9' width='18' height='14' rx='1.5' fill='%23000' stroke='%23e3a33a' stroke-width='1'/%3E%3Crect x='7' y='12' width='2' height='2' fill='%23f4f1ea'/%3E%3Crect x='11' y='12' width='2' height='2' fill='%23f4f1ea'/%3E%3Crect x='15' y='16' width='2' height='2' fill='%23f4f1ea'/%3E%3Ccircle cx='26' cy='12' r='1.4' fill='%232a2e29'/%3E%3Ccircle cx='26' cy='16.5' r='1.4' fill='%232a2e29'/%3E%3Ccircle cx='26' cy='21' r='1.4' fill='%232a2e29'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/sim.css?v=round1" />
  <style>
    #oled {
      width: var(--oled-w, 640px) !important;
      height: var(--oled-h, 320px) !important;
      max-width: none !important;
      border-radius: 10px !important;
    }
    .btn-col { width: var(--oled-btn, 56px) !important; }
    .hw {
      width: var(--oled-btn, 56px) !important;
      height: var(--oled-btn, 56px) !important;
    }
  </style>
  <script>
    (function () {
      function fit() {
        var ua = navigator.userAgent || "";
        var w = window.innerWidth || 1024;
        var h = window.innerHeight || 800;
        var phone = w < 700 && Math.min(w, h) < 540 && /iPhone|iPod|Android|Mobile/i.test(ua) && !/Windows NT/i.test(ua);
        var root = document.documentElement;
        if (phone) {
          var ppm = (/iPhone|iPad|iPod/.test(ua) ? 163 : 160) / 25.4;
          root.style.setProperty("--oled-w", (21.744 * ppm).toFixed(2) + "px");
          root.style.setProperty("--oled-h", (10.864 * ppm).toFixed(2) + "px");
          root.style.setProperty("--oled-btn", "44px");
          return;
        }
        var side = w < 1100 ? 92 : 300;
        var availW = Math.max(200, w - side - 24);
        var availH = Math.max(140, h - 96);
        var s = Math.floor(Math.min(availW / 128, availH / 64, 8));
        if (s < 2) s = 2;
        if (s < 4 && availW >= 520) s = 4;
        if (s > 8) s = 8;
        root.style.setProperty("--oled-w", (128 * s) + "px");
        root.style.setProperty("--oled-h", (64 * s) + "px");
        root.style.setProperty("--oled-btn", Math.max(48, Math.min(64, Math.round((64 * s - 24) / 4))) + "px");
      }
      fit();
      window.addEventListener("resize", fit);
    })();
  </script>
</head>
<body>
  <main class="page">
    <div class="stage">
      <div class="fixture">
        <div class="bar">
          <span class="led" id="led"></span>
          <span class="brand">nimo</span>
          <span class="pill" id="app-pill">boot</span>
          <span class="silk" id="size-readout">4×</span>
        </div>
        <div class="rig">
          <div class="well">
            <canvas id="oled" width="128" height="64" aria-label="Ekran OLED 128 na 64"></canvas>
            <div class="glass" aria-hidden="true"></div>
          </div>
          <div class="btn-col" id="btn-col">
            <button type="button" class="hw" data-btn="0" aria-label="Góra"><span class="ring"></span><span class="glyph">▲</span></button>
            <button type="button" class="hw" data-btn="1" aria-label="Dół"><span class="ring"></span><span class="glyph">▼</span></button>
            <button type="button" class="hw" data-btn="2" aria-label="OK"><span class="ring"></span><span class="glyph">●</span></button>
            <button type="button" class="hw" data-btn="3" aria-label="Wstecz"><span class="ring"></span><span class="glyph">◄</span></button>
          </div>
          <div class="probes" id="probes">
            <div class="probe" data-i="0"><span class="k">▲</span><span class="t">wyżej</span><kbd>↑</kbd><span class="s" hidden></span></div>
            <div class="probe" data-i="1"><span class="k">▼</span><span class="t">niżej</span><kbd>↓</kbd><span class="s" hidden></span></div>
            <div class="probe" data-i="2"><span class="k">●</span><span class="t">OK</span><kbd>Enter</kbd><span class="s" hidden></span></div>
            <div class="probe" data-i="3"><span class="k">◄</span><span class="t">wstecz</span><kbd>Esc</kbd><span class="s" hidden></span></div>
          </div>
        </div>
        <p class="type-note" id="type-note" hidden>Litery z klawiatury.</p>
        <div class="actions">
          <button type="button" class="textbtn" id="btn-tutorial">Samouczek</button>
          <button type="button" class="textbtn" id="btn-skip">Pomiń</button>
          <button type="button" class="textbtn" id="btn-shot">Zrzut</button>
          <details class="poligon" id="poligon">
            <summary>Piny</summary>
            <div class="poligon-grid">
              <section>
                <dl>
                  <div><dt>Stos</dt><dd id="pol-stack">—</dd></div>
                  <div><dt>Zdarzenie</dt><dd id="pol-last">—</dd></div>
                  <div><dt>Uptime</dt><dd id="pol-up">00:00:00</dd></div>
                  <div><dt>Klatki</dt><dd id="pol-fps">—</dd></div>
                </dl>
              </section>
              <section>
                <ol id="pol-log"></ol>
              </section>
              <section>
                <ul class="pins">
                  <li><span>▲</span> 32</li>
                  <li><span>▼</span> 33</li>
                  <li><span>●</span> 25</li>
                  <li><span>◄</span> 26</li>
                  <li><span>I2C</span> 21 · 22 · 0x3C</li>
                </ul>
                <button type="button" class="textbtn" id="btn-reset">NVS</button>
              </section>
            </div>
          </details>
        </div>
      </div>
    </div>
  </main>
  <noscript>Potrzebny JavaScript.</noscript>
  <script type="module" src="js/platform/main.js?v=round1"></script>
</body>
</html>
